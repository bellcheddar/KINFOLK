# /etc/nginx/sites-available/kinfolk.mdeller.com  (certbot --nginx adds the TLS directives)
server {
    listen 80;
    listen [::]:80;
    server_name kinfolk.mdeller.com;

    # Shared access log in the vhost format, so the mdeller.com launcher's hit counter sees it
    # (the GATECRASHER lesson, as in PODIUM: a private log or the default format reads a flat zero).
    access_log /var/log/nginx/access.log vhost;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # What is live: written by kinfolk-pull on every deploy, never cached.
    location = /static/version.txt {
        alias /srv/kinfolk/app/static/version.txt;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # Static assets and specimen JSON straight from disk. Asset URLs are not fingerprinted, so a
    # short max-age plus ETag revalidation keeps a redeploy visible within minutes.
    location /static/ {
        alias /srv/kinfolk/app/static/;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
    # Pre-gzipped mmCIF: serve as-is with Content-Encoding so viewers receive plain text.
    location /structures/ {
        alias /srv/kinfolk/app/data/structures/;
        types { } default_type text/plain;
        add_header Content-Encoding gzip always;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=86400" always;
        gzip off;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# /etc/nginx/sites-available/kinfolk.mdeller.com  (certbot adds the 443 block)
server {
    listen 80;
    listen [::]:80;
    server_name kinfolk.mdeller.com;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets and specimen JSON straight from disk.
    location /static/ {
        alias /srv/kinfolk/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
    # Pre-gzipped mmCIF: serve as-is with Content-Encoding so viewers receive plain text.
    location /structures/ {
        alias /srv/kinfolk/app/data/structures/;
        types { } default_type text/plain;
        add_header Content-Encoding gzip;
        add_header Vary Accept-Encoding;
        gzip off;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
